name: Daily Momentum Screener

on:
  schedule:
    - cron: '10 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even on non-trading days'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy lxml html5lib

      - name: Run screener
        run: python3 scripts/screener_json.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add data/
          git diff --cached --quiet || {
            git commit -m "data: screening results $DATE"
            git push
          }

      - name: Send Telegram report
        if: always()
        continue-on-error: true
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.parse, sys, re

          # Aggressive sanitization: keep only alphanumeric, colon, dash
          raw_token = os.environ.get("RAW_TOKEN", "")
          raw_chat = os.environ.get("RAW_CHAT", "")
          TOKEN = re.sub(r'[^a-zA-Z0-9:\-_]', '', raw_token)
          CHAT = re.sub(r'[^0-9]', '', raw_chat)

          if not TOKEN or not CHAT:
              print("Telegram secrets not configured, skipping")
              sys.exit(0)

          print(f"Token length: {len(TOKEN)}, Chat ID: {CHAT}")
          print(f"Token starts with: {TOKEN[:12]}...")

          def send(msg):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              data = urllib.parse.urlencode({"chat_id": CHAT, "text": msg}).encode()
              req = urllib.request.Request(url, data=data)
              resp = urllib.request.urlopen(req)
              print(f"Telegram response: {resp.status}")

          try:
              with open("data/latest_screening.json") as f:
                  d = json.load(f)
          except Exception as e:
              send(f"SCREENING ECHOUE\nErreur: {e}")
              sys.exit(0)

          m = d["macro"]
          feu = "VERT" if m["status"] == "VERT" else "ROUGE"
          lines = []
          lines.append(f"SCREENING {d['timestamp_utc'][:10]}")
          lines.append(f"Feu macro : {feu} (HYG {m['hyg_last']} vs SMA100 {m['hyg_sma100']})")
          lines.append(f"Univers : {d['universe_size']} | Screenes : {d['screened']}")
          lines.append("")

          sigs = d.get("signals_complete", [])
          if sigs:
              lines.append(f"{len(sigs)} SIGNAUX COMPLETS :")
              for s in sigs:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%} | stop {s['stop']}$")
              lines.append("")
          else:
              lines.append("Aucun signal complet")
              lines.append("")

          brk = d.get("breakouts_no_volume", [])
          if brk:
              lines.append(f"{len(brk)} breakouts sans volume :")
              for s in brk[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              if len(brk) > 5:
                  lines.append(f"  ... et {len(brk)-5} autres")
              lines.append("")

          watch = d.get("watchlist", [])
          if watch:
              lines.append(f"{len(watch)} en watchlist :")
              for s in watch[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              if len(watch) > 5:
                  lines.append(f"  ... et {len(watch)-5} autres")
              lines.append("")

          early = d.get("early_signals", [])
          if early:
              lines.append(f"{len(early)} EARLY ROCKETS :")
              for s in early[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              lines.append("")

          if sigs:
              lines.append("-> Ouvre Claude Code pour valider les ordres")
          else:
              lines.append("RAS - pas d'action requise ce soir")

          send("\n".join(lines))
          PYEOF
