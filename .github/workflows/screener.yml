name: Daily Momentum Screener

on:
  schedule:
    # 20:10 UTC = 16:10 EDT (New York) — apres cloture US
    - cron: '10 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even on non-trading days'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy lxml html5lib

      - name: Run screener
        run: python3 scripts/screener_json.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add data/
          git diff --cached --quiet || {
            git commit -m "data: screening results $DATE"
            git push
          }

      - name: Send Telegram report
        if: always()
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Clean whitespace/newlines from secrets
          export TELEGRAM_BOT_TOKEN=$(echo "$RAW_TOKEN" | tr -d '[:space:]')
          export TELEGRAM_CHAT_ID=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping"
            exit 0
          fi
          
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.parse, sys

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT  = os.environ["TELEGRAM_CHAT_ID"]

          def send(msg):
              data = urllib.parse.urlencode({"chat_id": CHAT, "text": msg}).encode()
              try:
                  urllib.request.urlopen(f"https://api.telegram.org/bot{TOKEN}/sendMessage", data)
                  print("Telegram message sent")
              except Exception as e:
                  print(f"Telegram send failed: {e}", file=sys.stderr)
                  sys.exit(1)

          try:
              with open("data/latest_screening.json") as f:
                  d = json.load(f)
          except Exception as e:
              send(f"SCREENING ECHOUE\n\nErreur: {e}")
              sys.exit(0)

          m = d["macro"]
          feu = "VERT" if m["status"] == "VERT" else "ROUGE"
          lines = []
          lines.append(f"SCREENING {d['timestamp_utc'][:10]}")
          lines.append(f"Feu macro : {feu} (HYG {m['hyg_last']} vs SMA100 {m['hyg_sma100']})")
          lines.append(f"Univers : {d['universe_size']} titres | Screenes : {d['screened']}")
          lines.append("")

          sigs = d.get("signals_complete", [])
          if sigs:
              lines.append(f"{len(sigs)} SIGNAUX COMPLETS :")
              for s in sigs:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%} | stop {s['stop']}$ | risque {s['risk_pct']:.0%}")
              lines.append("")
          else:
              lines.append("Aucun signal complet")
              lines.append("")

          brk = d.get("breakouts_no_volume", [])
          if brk:
              lines.append(f"{len(brk)} breakouts sans volume :")
              for s in brk[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              if len(brk) > 5:
                  lines.append(f"  ... et {len(brk)-5} autres")
              lines.append("")

          watch = d.get("watchlist", [])
          if watch:
              lines.append(f"{len(watch)} en watchlist :")
              for s in watch[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%} | dist {s['dist_hh60']:+.1%}")
              if len(watch) > 5:
                  lines.append(f"  ... et {len(watch)-5} autres")
              lines.append("")

          early = d.get("early_signals", [])
          if early:
              lines.append(f"{len(early)} EARLY ROCKETS :")
              for s in early[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%} | vs ATH {s['vs_ath']:+.0%}")
              lines.append("")

          if sigs:
              lines.append("Ouvre Claude Code pour valider les ordres")
          else:
              lines.append("RAS - pas d'action requise ce soir")

          send("\n".join(lines))
          PYEOF
