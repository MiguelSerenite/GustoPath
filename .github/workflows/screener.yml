name: Daily Momentum Screener

on:
  schedule:
    - cron: '10 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even on non-trading days'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy lxml html5lib

      - name: Run screener
        run: python3 scripts/screener_json.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add data/
          git diff --cached --quiet || {
            git commit -m "data: screening results $DATE"
            git push
          }

      - name: Build Telegram report
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, sys
          try:
              with open("data/latest_screening.json") as f:
                  d = json.load(f)
          except Exception as e:
              with open("/tmp/telegram_msg.txt", "w") as f:
                  f.write(f"SCREENING ECHOUE\nErreur: {e}")
              sys.exit(0)

          m = d["macro"]
          feu = "VERT" if m["status"] == "VERT" else "ROUGE"
          lines = []
          lines.append(f"SCREENING {d['timestamp_utc'][:10]}")
          lines.append(f"Feu macro : {feu} (HYG {m['hyg_last']} vs SMA100 {m['hyg_sma100']})")
          lines.append(f"Univers : {d['universe_size']} | Screenes : {d['screened']}")
          lines.append("")

          sigs = d.get("signals_complete", [])
          if sigs:
              lines.append(f"{len(sigs)} SIGNAUX COMPLETS :")
              for s in sigs:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%} | stop {s['stop']}$")
              lines.append("")
          else:
              lines.append("Aucun signal complet")
              lines.append("")

          brk = d.get("breakouts_no_volume", [])
          if brk:
              lines.append(f"{len(brk)} breakouts sans volume :")
              for s in brk[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              if len(brk) > 5:
                  lines.append(f"  ... et {len(brk)-5} autres")
              lines.append("")

          watch = d.get("watchlist", [])
          if watch:
              lines.append(f"{len(watch)} en watchlist :")
              for s in watch[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              if len(watch) > 5:
                  lines.append(f"  ... et {len(watch)-5} autres")
              lines.append("")

          early = d.get("early_signals", [])
          if early:
              lines.append(f"{len(early)} EARLY ROCKETS :")
              for s in early[:5]:
                  lines.append(f"  {s['ticker']} {s['price']}$ | mom3m {s['mom_3m']:+.0%}")
              lines.append("")

          if sigs:
              lines.append("-> Ouvre Claude Code pour valider les ordres")
          else:
              lines.append("RAS - pas d'action requise ce soir")

          with open("/tmp/telegram_msg.txt", "w") as f:
              f.write("\n".join(lines))
          print("Report built successfully")
          PYEOF

      - name: Send Telegram
        if: always()
        continue-on-error: true
        run: |
          # Sanitize: strip ALL whitespace, control chars, BOM, zero-width chars
          TOKEN=$(echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | sed 's/[^a-zA-Z0-9:_-]//g')
          CHATID=$(echo "${{ secrets.TELEGRAM_CHAT_ID }}" | sed 's/[^0-9]//g')
          
          echo "Token length: ${#TOKEN}"
          echo "Token prefix: ${TOKEN:0:12}..."
          echo "Chat ID: $CHATID"
          
          if [ -z "$TOKEN" ] || [ -z "$CHATID" ]; then
            echo "ERROR: Token or Chat ID empty after sanitization"
            exit 1
          fi
          
          MSG=$(cat /tmp/telegram_msg.txt 2>/dev/null || echo "Screening termine - voir GitHub pour details")
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHATID" \
            --data-urlencode text="$MSG")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "TELEGRAM FAILED - check token and chat_id"
            echo "If 401: token is invalid - regenerate from @BotFather"
            echo "If 400: chat_id is wrong or bot hasn't been started"
            exit 1
          fi
          
          echo "Telegram sent successfully!"
